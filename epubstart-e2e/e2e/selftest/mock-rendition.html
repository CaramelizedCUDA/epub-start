<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>mock rendition（走书器自检用）</title>
<!--
  这不是 EPUB.js。它用真实浏览器的 CSS 多列 + 容器 scrollLeft 模拟 EPUB.js default manager 的分页方式，
  并实现了 walker.js 用到的那一小撮 Rendition 接口。用途只有一个：
  在不依赖 EPUB.js 和你的应用的前提下，验证 walker.js 的“字符→页面”测量逻辑和不变量规则本身是对的。
  ?bug=none|skip|tailjump|blank|prevskip 可以埋入已知缺陷，用来确认检查器真的能抓到它们（负向对照）。
-->
<style>
  html, body { margin: 0; background: #fff; }
  #c { width: 600px; height: 400px; overflow: hidden; position: relative; }
  #f { border: 0; height: 400px; display: block; }
</style>
</head>
<body>
<div id="c"><iframe id="f"></iframe></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var BUG = params.get("bug") || "none";
  var PW = 600, GAP = 60, COLW = PW - GAP, H = 400;

  var container = document.getElementById("c");
  var frame = document.getElementById("f");

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var LATIN = "the quick brown fox jumps over lazy dogs while reading books about pagination columns and layout".split(" ");
  var CJK = "春夏秋冬风花雪月山水云雨天地人心光影书页墨字行间".split("");
  function para(r, chars, cjk) {
    var s = "";
    while (s.length < chars) {
      if (cjk) { s += CJK[Math.floor(r() * CJK.length)]; if (r() < 0.08) s += "，"; if (r() < 0.04) s += "。"; }
      else { s += LATIN[Math.floor(r() * LATIN.length)] + " "; }
    }
    return s;
  }
  // 三章：长章 / 极短章 / 带图的中长章
  var IMG = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"><rect width="300" height="140" fill="#9ab"/></svg>');
  // window.__MOCK_BOOK = { chapters: [{href, html}], css } 时改用外部提供的书（自检脚本用它来验证 fixture 本身）
  var EXT = window.__MOCK_BOOK || null;
  var BOOK_CSS = EXT ? EXT.css : "";
  var CHAPTERS = EXT ? EXT.chapters : [0, 1, 2].map(function (i) {
    var r = rng(1000 + i);
    var sizes = [[24, 130], [1, 90], [10, 120]][i];
    var html = "<h1>第" + (i + 1) + "章</h1>";
    for (var k = 0; k < sizes[0]; k++) {
      html += "<p>" + para(r, sizes[1], i % 2 === 1 || k % 3 === 0) + "</p>";
      if (i === 2 && k === 4) html += '<p><img src="' + IMG + '" alt=""></p>';
    }
    return { href: "ch" + (i + 1) + ".xhtml", html: html };
  });

  var listeners = {};
  function on(n, f) { (listeners[n] = listeners[n] || []).push(f); }
  function off(n, f) { listeners[n] = (listeners[n] || []).filter(function (x) { return x !== f; }); }
  function once(n, f) { var w = function (a) { off(n, w); f(a); }; on(n, w); }
  function emit(n, a) { (listeners[n] || []).slice().forEach(function (f) { f(a); }); }

  var cur = 0;

  function maxScroll() { return container.scrollWidth - container.clientWidth; }

  async function load(i, atEnd) {
    cur = i;
    // EPUB.js 每个章节是新的 iframe；这里复位宽度来模拟。bug=blank 时故意不复位，
    // 于是短章会继承上一章的宽度，尾部出现空白页。
    if (BUG !== "blank") frame.style.width = PW + "px";
    await new Promise(function (res) {
      frame.onload = res;
      frame.srcdoc =
        '<!doctype html><html><head><meta charset="utf-8"><style>' +
        "html{width:" + COLW + "px;height:" + H + "px;column-width:" + COLW + "px;column-gap:" + GAP + "px;column-fill:auto;overflow:hidden}" +
        "body{margin:0;font:16px/1.5 serif}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 8px}" +
        "img{max-width:" + COLW + "px;max-height:" + H + "px}" +
        BOOK_CSS +
        "</style></head><body>" + CHAPTERS[i].html + "</body></html>";
    });
    var d = frame.contentDocument;
    if (d.fonts && d.fonts.ready) await d.fonts.ready;
    // 与 EPUB.js 一样：iframe 宽度 = 多列内容的实际宽度，容器横向滚动
    frame.style.width = d.documentElement.scrollWidth + "px";
    await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
    container.scrollLeft = atEnd ? maxScroll() : 0;
  }

  function located() {
    return {
      start: { index: cur, href: CHAPTERS[cur].href, cfi: "mock/" + cur + "/" + container.scrollLeft },
      atEnd: cur === CHAPTERS.length - 1 && container.scrollLeft >= maxScroll() - 1,
    };
  }
  function report() {
    requestAnimationFrame(function () {
      rendition.location = located();
      emit("relocated", rendition.location);
    });
  }

  var rendition = {
    location: null,
    book: { spine: { length: CHAPTERS.length } },
    manager: { container: container, layout: { delta: PW } },
    on: on, off: off, once: once,
    getContents: function () {
      return frame.contentDocument ? [{ document: frame.contentDocument, window: frame.contentWindow }] : [];
    },
    currentLocation: function () { return located(); },
    // 数字 = 章节下标；"mock/<章>/<scrollLeft>" = 模拟 CFI（walker 用它在往返探测失败后把阅读器拉回原页）
    display: async function (i) {
      var m = typeof i === "string" && /^mock\/(\d+)\/([\d.]+)$/.exec(i);
      if (m) { await load(+m[1], false); container.scrollLeft = +m[2]; }
      else await load(typeof i === "number" ? i : 0, false);
      report();
    },
    next: async function () {
      var max = maxScroll();
      var sl = container.scrollLeft;
      if (sl < max - 1) {
        var remaining = max - sl;
        if (BUG === "tailjump" && remaining < PW - 1) {
          // 缺陷：剩余不足一页时不先滚到章末，直接跳下一章（尾页补丁要防的就是这个）
          if (cur < CHAPTERS.length - 1) await load(cur + 1, false);
        } else if (BUG === "skip" && cur === 0 && Math.abs(sl - PW) < 1) {
          container.scrollLeft = Math.min(sl + 2 * PW, max); // 缺陷：第 1 章第 2 页翻过头，多翻一页
        } else {
          container.scrollLeft = Math.min(sl + PW, max); // 剩余不足一页时贴章末
        }
      } else if (cur < CHAPTERS.length - 1) {
        await load(cur + 1, false);
      }
      report();
    },
    prev: async function () {
      var sl = container.scrollLeft;
      if (sl > 1) {
        // bug=prevskip：从第 4 页往回翻时多退一页（next 正常、prev 不对称）
        var back = BUG === "prevskip" && cur === 0 && Math.abs(sl - 3 * PW) < 1 ? 2 * PW : PW;
        container.scrollLeft = Math.max(0, sl - back);
      } else if (cur > 0) await load(cur - 1, true);
      report();
    },
  };
  window.__EPUBSTART_E2E__ = { rendition: rendition, book: rendition.book };
  window.__mockReady = load(0, false).then(report);
})();
</script>
</body>
</html>

[package]
name = "epub-start"
version = "0.1.0"
description = "A minimal, high-performance cross-platform EPUB reader"
authors = [""]
edition = "2021"

[lib]
name = "epub_start_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Enable the embedded asset protocol for production/profile Android builds.
# Keep this opt-in so `tauri dev` continues to use `build.devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "0.6"
quick-xml = "0.31"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
